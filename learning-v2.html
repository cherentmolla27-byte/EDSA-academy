<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDSA Learning Center</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#0b2145;font-family:Inter,system-ui,sans-serif}.top{background:#061a3b;color:#fff;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:950}.brand small{display:block;color:#93c5fd;font-size:8px;letter-spacing:.15em;margin-top:3px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:850;cursor:pointer}.blue{background:#1677ff;color:#fff}.light{background:#fff;color:#0b2145;border:1px solid #dbeafe}.wrap{max-width:1150px;margin:auto;padding:25px 5% 60px}.hero{background:linear-gradient(120deg,#061a3b,#0b3f83 60%,#1677ff);color:#fff;border-radius:22px;padding:26px;margin-bottom:16px}.hero h1{margin:8px 0}.hero p{color:#dbeafe;line-height:1.6;font-size:13px}.panel{background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:19px;box-shadow:0 10px 28px rgba(15,66,120,.07)}.courses,.lessons{display:grid;gap:9px}.course,.lesson{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fbff;cursor:pointer}.course strong,.lesson strong{display:block;font-size:12px}.course span,.lesson span{display:block;font-size:9px;color:#64748b;margin-top:4px}.course b{display:block;color:#1677ff;font-size:9px;margin-top:7px}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.lesson.active{border-color:#1677ff;background:#eff6ff}.lesson.done{border-color:#bbf7d0;background:#f0fdf4}.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#eff6ff;color:#1677ff;font-weight:900;margin-right:9px}.viewer{margin-top:16px;background:#061a3b;color:#fff;border-radius:17px;padding:24px}.viewer h2{margin-top:0}.copy{color:#dbeafe;line-height:1.85;font-size:13px}.bar{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#1677ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.lock{padding:16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;color:#9a3412}@media(max-width:799px){.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.wrap{padding:18px 4% 40px}}</style></head><body><header class="top"><div class="brand">EDSA ACADEMY<small>LEARNING CENTER</small></div><div><button class="btn light" onclick="location.href='/'">Dashboard</button> <button class="btn blue" onclick="location.href='/edsa-app.html'">Exam Portal</button></div></header><main class="wrap"><section class="hero"><div style="font-size:9px;letter-spacing:.16em;color:#bfdbfe;font-weight:900">STEP 14 — LEARNING PLATFORM</div><h1>Learn. Practice. Get Certified.</h1><p id="welcome">Loading your student account...</p></section><div id="courseHome" class="panel"><h2>Choose a Course</h2><p style="color:#64748b;font-size:12px">Your 400 ETB activation unlocks one course. Complete all 15 lessons before the examination becomes available.</p><div id="courseList" class="courses"></div></div><div id="courseView" class="grid" style="display:none"><aside class="panel"><button class="btn light" onclick="home()">← All Courses</button><div id="side" class="lessons" style="margin-top:14px"></div></aside><section class="panel"><div id="area"></div></section></div></main><script>
const COURSES={smm:{title:'Social Media Management',desc:'Social strategy, content, communities and platform management.',lessons:['Digital Social Media Foundations','Audience Research & Buyer Personas','Platform Selection & Strategy','Content Pillars & Planning','Content Calendars','Copywriting for Social Media','Visual Content & Branding','Short-Form Video Strategy','Community Management','Social Media Engagement','Hashtags, Keywords & Discovery','Analytics & Performance Metrics','Social Media Crisis Management','Campaign Planning & Optimization','Professional Social Media Workflow']},dme:{title:'Digital Marketing Essentials',desc:'Digital campaigns, channels, analytics and marketing strategy.',lessons:['Digital Marketing Foundations','Customer Journey & Funnels','Market Research','Digital Marketing Strategy','Search Engine Basics','Content Marketing','Email Marketing','Social Advertising','Paid Search & Display','Landing Pages & Conversion','Analytics & KPIs','Remarketing & Retention','Campaign Budgeting','A/B Testing & Optimization','Integrated Digital Campaigns']},pbm:{title:'Project & Business Management',desc:'Planning, operations, projects, leadership and business decisions.',lessons:['Business Management Foundations','Business Models','Goal Setting & SMART Objectives','Project Life Cycle','Project Scope & Requirements','Work Breakdown Structures','Scheduling & Milestones','Budgeting & Cost Control','Risk Management','Team Leadership','Communication Management','Operations & Process Improvement','Decision Making','Performance Measurement','Project Closeout & Review']},gdm:{title:'Graphic Design for Marketers',desc:'Visual communication, design principles, branding and marketing graphics.',lessons:['Design Foundations','Color Theory','Typography','Layout & Composition','Visual Hierarchy','Brand Identity','Logo & Brand Systems','Social Media Graphics','Marketing Banners','Image Selection & Editing','Canva Workflow','Design for Mobile','Accessibility & Readability','Creative Briefs','Professional Design Review']},fme:{title:'Financial Management for Entrepreneurs',desc:'Budgeting, cash flow, financial decisions and entrepreneurial finance.',lessons:['Financial Foundations','Revenue & Costs','Budgeting','Cash Flow Management','Profit & Loss','Pricing Decisions','Break-Even Analysis','Working Capital','Financial Records','Business Finance','Funding Options','Investment Decisions','Financial Risk','Financial KPIs','Entrepreneurial Finance Review']},dbi:{title:'Data Analysis & Business Intelligence',desc:'Data, dashboards, analytics, databases and business intelligence.',lessons:['Data Foundations','Data Collection','Data Quality','Spreadsheets for Analysis','Descriptive Statistics','Data Visualization','Dashboards','KPIs & Metrics','Database Basics','SQL Concepts','Business Intelligence','Customer Data Analysis','Sales Data Analysis','Reporting & Insights','Business Intelligence Workflow']}};
let course=null,lesson=0,completed=0;const qs=new URLSearchParams(location.search);const token=()=>sessionStorage.getItem('EDSA_SESSION_TOKEN')||localStorage.getItem('EDSA_SESSION_TOKEN')||'';const email=()=>String(localStorage.getItem('EDSA_LAST_ACTIVATED_EMAIL')||'').toLowerCase();const pkey=id=>'EDSA_LESSON_PROGRESS_'+email()+'_'+id;const unlockKey=id=>'EDSA_COURSE_UNLOCKED_'+email()+'_'+id;
function headers(){const t=token();return t?{Authorization:'Bearer '+t}:{};}function save(){localStorage.setItem(pkey(course),String(completed));}function load(){completed=Math.max(0,Math.min(15,Number(localStorage.getItem(pkey(course))||0)));}function home(){document.getElementById('courseHome').style.display='block';document.getElementById('courseView').style.display='none';}
async function access(id){try{const r=await fetch('/api/course-access?courseId='+encodeURIComponent(id),{credentials:'include',headers:headers(),cache:'no-store'});const x=await r.json().catch(()=>({}));if(r.status===401){location.href='/?login=1&return='+encodeURIComponent('/learning.html?course='+id);return false}if(r.ok&&x.ok&&x.unlocked){localStorage.setItem(unlockKey(id),'1');return true} }catch(e){}return localStorage.getItem(unlockKey(id))==='1';}
function draw(){load();const c=course;document.getElementById('side').innerHTML=c.lessons.map((x,i)=>'<div class="lesson '+(i===lesson?'active ':'')+(i<completed?'done':'')+'" '+(i<=completed?'onclick="openLesson('+i+')"':'')+'><span class="num">'+(i<completed?'✓':i+1)+'</span><strong style="display:inline">'+x+'</strong><span style="margin-left:40px">Lesson '+(i+1)+(i<completed?' • Completed':'')+'</span></div>').join('');document.getElementById('area').innerHTML='<div><h2>'+c.title+'</h2><p style="color:#64748b;font-size:11px">Lesson '+(lesson+1)+' of 15</p><div class="bar"><i style="width:'+(completed/15*100)+'%"></i></div><small style="color:#64748b;font-weight:800">'+completed+' / 15 lessons completed</small></div><div class="viewer"><div style="font-size:9px;color:#93c5fd;font-weight:900;letter-spacing:.14em">LESSON '+(lesson+1)+' OF 15</div><h2>'+c.lessons[lesson]+'</h2><div class="copy"><p>This lesson covers <strong>'+c.lessons[lesson]+'</strong>. Study the material carefully and connect it to a real business, creator, merchant or digital project.</p><h3>What you should understand</h3><p>Understand the key concepts, process, practical application, common mistakes and measurable outcomes related to this topic.</p><h3>Practical EDSA application</h3><p>Apply this lesson to an Ethiopian business or digital project. Write down one realistic example and one action you could take.</p><h3>Quick review</h3><p>Explain the topic in your own words before continuing. Your next lesson unlocks only after you complete this one.</p></div><div class="actions">'+(lesson>0?'<button class="btn light" onclick="openLesson('+(lesson-1)+')">← Previous</button>':'')+(lesson<14?'<button class="btn blue" onclick="nextLesson()">Complete Lesson & Next →</button>':'<button class="btn blue" onclick="finish15()">Complete Lesson 15 →</button>')+'</div></div>'}
function openLesson(i){if(i>completed)return;lesson=i;draw();window.scrollTo({top:0,behavior:'smooth'});}function nextLesson(){completed=Math.max(completed,lesson+1);save();if(completed<15){lesson=completed;draw();}else{lesson=14;draw();}}function finish15(){completed=15;save();draw();document.getElementById('area').insertAdjacentHTML('beforeend','<div class="lock" style="margin-top:14px"><strong>🎓 You completed all 15 lessons.</strong><p>Your examination is now available.</p><button class="btn blue" onclick="goExam()">Now Take the Exam →</button></div>');}function goExam(){if(completed<15)return alert('Complete all 15 lessons first.');location.href='/edsa-app.html?course='+encodeURIComponent(course.id)+'&exam=1';}
function renderCourses(){document.getElementById('courseList').innerHTML=Object.entries(COURSES).map(([id,c])=>'<div class="course" onclick="selectCourse(\''+id+'\')"><strong>'+c.title+'</strong><span>'+c.desc+'</span><b>15 lessons • Open →</b></div>').join('');}
async function selectCourse(id){if(!COURSES[id])return;const ok=await access(id);if(!ok)return alert('This course is locked. Activate this course with your 400 ETB key first.');course=COURSES[id];document.getElementById('courseHome').style.display='none';document.getElementById('courseView').style.display='grid';load();lesson=Math.min(Number(qs.get('lesson')||0),completed,14);draw();}
(async function(){renderCourses();try{const r=await fetch('/api/auth-me',{credentials:'include',headers:headers(),cache:'no-store'});const x=await r.json().catch(()=>({}));if(!r.ok||!x.authenticated){location.href='/?login=1&return='+encodeURIComponent(location.pathname+location.search);return}document.getElementById('welcome').textContent='Welcome, '+(x.user?.name||'Student')+'. Your activated course is your learning path.';}catch(e){document.getElementById('welcome').textContent='Sign in to access your learning path.'}const id=qs.get('course');if(id&&COURSES[id])selectCourse(id)})();
</script></body></html>
