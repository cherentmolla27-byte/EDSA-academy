<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#0b2145;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:20;background:#061a3b;color:#fff;padding:13px 5%;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 4px 20px rgba(3,18,45,.15)}.brand{font-weight:950;font-size:16px;letter-spacing:.04em}.brand span{color:#60a5fa}.brand small{display:block;color:#93c5fd;font-size:8px;letter-spacing:.15em;margin-top:3px}.top-actions{display:flex;align-items:center;gap:8px}.student-chip{font-size:10px;font-weight:800;color:#bfdbfe;background:#0b315f;padding:8px 10px;border-radius:999px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:#1677ff;color:#fff}.ghost{background:#fff;color:#0b2145}.wrap{max-width:1180px;margin:auto;padding:26px 5% 70px}.welcome{background:linear-gradient(125deg,#061a3b,#0b3f83 58%,#1677ff);color:#fff;border-radius:24px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px;box-shadow:0 18px 40px rgba(11,63,131,.18)}.eyebrow{font-size:9px;letter-spacing:.17em;font-weight:950;color:#bfdbfe}.eyebrow.dark{color:#1677ff}.welcome h1{font-size:34px;line-height:1.08;margin:8px 0 10px;letter-spacing:-.03em}.welcome h1 span{color:#60a5fa}.welcome p{margin:0;color:#dbeafe;font-size:13px;line-height:1.6;max-width:650px}.welcome-stat{min-width:130px;height:130px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:22px;display:grid;place-items:center;align-content:center}.welcome-stat strong{font-size:42px;line-height:1}.welcome-stat span{font-size:10px;color:#bfdbfe;font-weight:800;margin-top:7px}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:15px}.section-heading h2{font-size:22px;margin:5px 0 0}.small-note{font-size:10px;color:#64748b;font-weight:800}.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.course-card{position:relative;overflow:hidden;background:#fff;border:1px solid #dbe6f3;border-radius:18px;padding:20px;min-height:190px;cursor:pointer;transition:.18s;box-shadow:0 8px 24px rgba(15,66,120,.06)}.course-card:hover{transform:translateY(-3px);border-color:#93c5fd;box-shadow:0 16px 32px rgba(15,66,120,.11)}.course-top{display:flex;justify-content:space-between;align-items:center}.course-icon{width:45px;height:45px;border-radius:13px;background:#eff6ff;color:#1677ff;display:grid;place-items:center;font-size:22px}.status{font-size:9px;font-weight:950;padding:6px 8px;border-radius:999px;background:#f1f5f9;color:#64748b}.status.unlocked{background:#dcfce7;color:#15803d}.course-card h3{font-size:15px;margin:17px 0 7px}.course-card p{font-size:10px;line-height:1.55;color:#64748b;margin:0}.course-meta{display:flex;justify-content:space-between;margin-top:16px;font-size:9px;font-weight:900;color:#1677ff}.portal{display:grid;grid-template-columns:315px 1fr;gap:16px}.lesson-sidebar,.lesson-main{background:#fff;border:1px solid #dbe6f3;border-radius:20px;box-shadow:0 8px 24px rgba(15,66,120,.06)}.lesson-sidebar{padding:16px}.back-link{border:0;background:none;color:#1677ff;font-weight:900;font-size:11px;cursor:pointer;padding:6px 0 16px}.side-title{font-size:17px;font-weight:950;line-height:1.2;margin:2px 0 5px}.side-desc{font-size:9px;color:#64748b;line-height:1.5}.progress-card{margin:17px 0 13px;padding:13px;background:#f8fbff;border:1px solid #e2e8f0;border-radius:13px}.progress-row{display:flex;justify-content:space-between;font-size:9px;font-weight:900}.progress-row b{color:#1677ff}.progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:9px 0 5px}.progress i{display:block;height:100%;width:0;background:#1677ff;border-radius:99px}.progress-card small{font-size:8px;color:#64748b;font-weight:800}.lesson-list{display:grid;gap:7px;max-height:55vh;overflow:auto}.lesson-item{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #e2e8f0;border-radius:11px;background:#fff;cursor:pointer}.lesson-item.active{border-color:#1677ff;background:#eff6ff}.lesson-item.done{background:#f0fdf4;border-color:#bbf7d0}.lesson-num{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#eff6ff;color:#1677ff;font-size:9px;font-weight:950;flex:none}.lesson-item.done .lesson-num{background:#dcfce7;color:#15803d}.lesson-item strong{font-size:9px;line-height:1.35}.lesson-item span{display:block;font-size:8px;color:#64748b;margin-top:2px}.lesson-main{padding:24px}.lesson-kicker{font-size:9px;color:#1677ff;font-weight:950;letter-spacing:.14em}.lesson-main h2{font-size:27px;line-height:1.15;margin:7px 0}.lesson-intro{font-size:12px;color:#64748b;line-height:1.7;margin:0}.lesson-copy{margin-top:20px;background:#061a3b;color:#fff;border-radius:17px;padding:24px}.lesson-copy h4{font-size:15px;margin:19px 0 7px;color:#fff}.lesson-copy h4:first-child{margin-top:0}.lesson-copy p{font-size:12px;line-height:1.85;color:#dbeafe;margin:0 0 10px}.example{background:#0b3f83;border:1px solid #3b82f6;border-radius:12px;padding:15px;margin-top:18px}.example strong{display:block;color:#bfdbfe;font-size:10px;letter-spacing:.08em;margin-bottom:5px}.example p{margin:0}.video{margin-top:18px;background:#020617;border:1px solid #315b91;border-radius:13px;padding:15px}.video b{display:block;color:#60a5fa;font-size:13px}.video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:12px}.lesson-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px}.action-right{display:flex;gap:8px;flex-wrap:wrap}.complete{background:#16a34a;color:#fff}.exam-ready{margin-top:16px;background:#ecfdf5;border:1px solid #86efac;border-radius:14px;padding:17px}.exam-ready h3{margin:0 0 5px;font-size:15px;color:#166534}.exam-ready p{margin:0 0 12px;font-size:10px;color:#166534;line-height:1.5}.locked{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:17px}.empty{text-align:center;padding:35px;color:#64748b;font-size:12px}@media(max-width:900px){.course-grid{grid-template-columns:repeat(2,1fr)}.portal{grid-template-columns:1fr}.lesson-list{max-height:none}}@media(max-width:620px){.top{padding:11px 4%}.student-chip{display:none}.ghost{display:none}.wrap{padding:18px 4% 45px}.welcome{padding:23px;align-items:flex-start}.welcome h1{font-size:27px}.welcome-stat{min-width:86px;width:86px;height:86px}.welcome-stat strong{font-size:30px}.welcome-stat span{text-align:center;font-size:8px}.course-grid{grid-template-columns:1fr}.lesson-main{padding:16px}.lesson-main h2{font-size:23px}.lesson-copy{padding:18px}}
</style></head><body><header class="top">
  <div class="brand">EDSA <span>ACADEMY</span><small>STUDENT LEARNING PORTAL</small></div>
  <div class="top-actions">
    <span id="studentName" class="student-chip">Student</span>
    <button class="btn ghost" onclick="location.href='/'">Home</button>
    <button class="btn primary" onclick="location.href='/edsa-app.html'">Exam Portal</button>
  </div>
</header>
<main class="wrap">
  <section class="welcome">
    <div>
      <div class="eyebrow">YOUR LEARNING SPACE</div>
      <h1>Choose your course.<br><span>Start learning.</span></h1>
      <p id="welcome">Your courses, lessons, progress and exam journey — all in one place.</p>
    </div>
    <div class="welcome-stat"><strong>15</strong><span>lessons per course</span></div>
  </section>

  <section id="courseHome">
    <div class="section-heading">
      <div><div class="eyebrow dark">MY COURSES</div><h2>What do you want to learn today?</h2></div>
      <div id="courseCount" class="small-note">Checking your access…</div>
    </div>
    <div id="courseList" class="course-grid"></div>
  </section>

  <section id="courseView" class="portal" style="display:none">
    <aside class="lesson-sidebar">
      <button class="back-link" onclick="showCourseHome()">← All courses</button>
      <div id="sideCourse"></div>
      <div class="progress-card">
        <div class="progress-row"><span>Course progress</span><b id="progressPct">0%</b></div>
        <div class="progress"><i id="progressBar"></i></div>
        <small id="progressText">0 / 15 lessons</small>
      </div>
      <div id="lessonList" class="lesson-list"></div>
    </aside>

    <section class="lesson-main">
      <div id="lessonArea"></div>
    </section>
  </section>
</main><script>
const COURSES={
 smm:{title:"Social Media Management",desc:"Social strategy, content, communities and platform management.",icon:"📱"},
 dme:{title:"Digital Marketing Essentials",desc:"Digital campaigns, channels, analytics and marketing strategy.",icon:"📈"},
 pbm:{title:"Project & Business Management",desc:"Planning, operations, projects, leadership and business decisions.",icon:"📋"},
 gdm:{title:"Graphic Design for Marketers",desc:"Visual communication, design principles, branding and marketing graphics.",icon:"🎨"},
 fme:{title:"Financial Management for Entrepreneurs",desc:"Budgeting, cash flow, financial decisions and entrepreneurial finance.",icon:"💰"},
 dbi:{title:"Data Analysis & Business Intelligence",desc:"Data, dashboards, analytics, databases and business intelligence.",icon:"📊"}
};
let state={email:"",name:"",courseId:"",lessons:[],lesson:0,completed:[]};
const token=()=>sessionStorage.getItem("EDSA_SESSION_TOKEN")||localStorage.getItem("EDSA_SESSION_TOKEN")||"";
const authHeaders=()=>token()?{Authorization:"Bearer "+token()}: {};
const progressKey=id=>"EDSA_PORTAL_PROGRESS_"+(state.email||"guest").toLowerCase()+"_"+id;
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function loadProgress(){try{state.completed=JSON.parse(localStorage.getItem(progressKey(state.courseId))||"[]").map(Number).filter(Number.isInteger)}catch(_){state.completed=[]}}
function saveProgress(){localStorage.setItem(progressKey(state.courseId),JSON.stringify(state.completed));}
async function api(path){
 const r=await fetch(path,{credentials:"include",headers:authHeaders(),cache:"no-store"});
 const x=await r.json().catch(()=>({}));
 return {r,x};
}
async function boot(){
 const auth=await api("/api/auth-me");
 if(!auth.r.ok||!auth.x.authenticated){location.href="/?login=1&return="+encodeURIComponent("/learning.html");return;}
 state.email=auth.x.user?.email||"";state.name=auth.x.user?.name||"Student";
 document.getElementById("studentName").textContent=state.name;
 document.getElementById("welcome").textContent="Pick an activated course below. Your lessons stay available after you finish them, including after an exam attempt.";
 await renderCourseCards();
 const requested=new URLSearchParams(location.search).get("course");
 if(requested&&COURSES[requested]) openCourse(requested);
}
async function getAccess(id,withLessons=false){
 const {r,x}=await api("/api/course-access?courseId="+encodeURIComponent(id)+(withLessons?"&include=lessons":""));
 return {ok:r.ok&&x.ok&&x.unlocked,body:x};
}
async function renderCourseCards(){
 const list=document.getElementById("courseList");list.innerHTML="";
 let unlocked=0;
 for(const [id,c] of Object.entries(COURSES)){
   const a=await getAccess(id,false);if(a.ok)unlocked++;
   const pct=JSON.parse(localStorage.getItem(progressKey(id))||"[]").length;
   list.insertAdjacentHTML("beforeend",'<article class="course-card" onclick="openCourse(\''+id+'\')"><div class="course-top"><div class="course-icon">'+c.icon+'</div><span class="status '+(a.ok?"unlocked":"")+'">'+(a.ok?"UNLOCKED":"LOCKED")+'</span></div><h3>'+esc(c.title)+'</h3><p>'+esc(c.desc)+'</p><div class="course-meta"><span>15 lessons</span><span>'+(a.ok?pct+"% complete":"Activate →")+'</span></div></article>');
 }
 document.getElementById("courseCount").textContent=unlocked+" course"+(unlocked===1?"":"s")+" unlocked";
}
async function openCourse(id){
 if(!COURSES[id])return;
 const access=await getAccess(id,true);
 if(!access.ok){alert("This course is locked. Complete the 400 ETB activation process to unlock its lessons and first exam attempt.");return;}
 const lessons=Array.isArray(access.body.lessons)?access.body.lessons:[];
 if(!lessons.length){alert("The course lessons are not available yet. Please try again.");return;}
 state.courseId=id;state.lessons=lessons;state.lesson=0;loadProgress();
 document.getElementById("courseHome").style.display="none";document.getElementById("courseView").style.display="grid";
 history.replaceState(null,"","/learning.html?course="+encodeURIComponent(id));
 renderCourse();window.scrollTo({top:0,behavior:"smooth"});
}
function showCourseHome(){
 state.courseId="";document.getElementById("courseHome").style.display="";document.getElementById("courseView").style.display="none";
 history.replaceState(null,"","/learning.html");renderCourseCards();window.scrollTo({top:0,behavior:"smooth"});
}
function normalizeLesson(raw,index){
 if(typeof raw==="string")return {title:raw,intro:"Study this lesson carefully and connect it to a real business situation.",sections:[["Lesson focus",raw]],example:"Write one practical example showing how this lesson could be used."};
 return {title:raw?.title||"Lesson "+(index+1),intro:raw?.intro||raw?.description||"",sections:Array.isArray(raw?.sections)?raw.sections:[],example:raw?.example||raw?.practicalExample||"",video:raw?.video||null};
}
function renderCourse(){
 const c=COURSES[state.courseId], l=normalizeLesson(state.lessons[state.lesson],state.lesson);
 const total=state.lessons.length, done=state.completed.length, pct=Math.round(done/total*100), isDone=state.completed.includes(state.lesson), last=state.lesson===total-1;
 document.getElementById("sideCourse").innerHTML='<div class="side-title">'+esc(c.title)+'</div><div class="side-desc">'+esc(c.desc)+'</div>';
 document.getElementById("progressPct").textContent=pct+"%";document.getElementById("progressBar").style.width=pct+"%";document.getElementById("progressText").textContent=done+" / "+total+" lessons completed";
 document.getElementById("lessonList").innerHTML=state.lessons.map((raw,i)=>{const x=normalizeLesson(raw,i),d=state.completed.includes(i);return '<div class="lesson-item '+(i===state.lesson?"active ":"")+(d?"done":"")+'" onclick="openLesson('+i+')"><div class="lesson-num">'+(d?"✓":i+1)+'</div><div><strong>'+esc(x.title)+'</strong><span>'+(d?"Completed":"Lesson "+(i+1))+'</span></div></div>'}).join("");
 const sections=l.sections.map(s=>Array.isArray(s)?'<h4>'+esc(s[0])+'</h4><p>'+esc(s[1])+'</p>':'<p>'+esc(s)+'</p>').join("");
 let video="";
 if(l.video&&typeof l.video==="object"&&l.video.id) video='<div class="video"><b>🎥 Lesson video</b><iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(l.video.id)+'?rel=0" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div>';
 document.getElementById("lessonArea").innerHTML='<div class="lesson-kicker">LESSON '+(state.lesson+1)+' OF '+total+'</div><h2>'+esc(l.title)+'</h2><p class="lesson-intro">'+esc(l.intro)+'</p><div class="lesson-copy">'+sections+(l.example?'<div class="example"><strong>PRACTICAL EXAMPLE</strong><p>'+esc(l.example)+'</p></div>':"")+video+'</div><div class="lesson-actions"><div>'+(state.lesson>0?'<button class="btn ghost" onclick="openLesson('+(state.lesson-1)+')">← Previous</button>':"")+'</div><div class="action-right"><button class="btn '+(isDone?"ghost":"complete")+'" onclick="completeLesson()">'+(isDone?"✓ Completed":"✓ Mark Lesson Complete")+'</button>'+(state.lesson<total-1?'<button class="btn primary" onclick="nextLesson()">Next Lesson →</button>':"")+'</div></div>'+(done===total?'<div class="exam-ready"><h3>🎓 All lessons completed</h3><p>Your course is complete. Your next step is the examination. If you fail, your lessons remain unlocked; only the next exam attempt requires another exam payment.</p><button class="btn primary" onclick="goExam()">Take the Exam →</button></div>':"");
}
function openLesson(i){if(i<0||i>=state.lessons.length)return;if(i>0&&!state.completed.includes(i)&&i>Math.max(-1,...state.completed))return;state.lesson=i;renderCourse();window.scrollTo({top:0,behavior:"smooth"});}
function completeLesson(){
 if(!state.completed.includes(state.lesson))state.completed.push(state.lesson);
 state.completed.sort((a,b)=>a-b);saveProgress();renderCourse();renderCourseCards();
 if(state.completed.length===state.lessons.length){setTimeout(goExam,500);return;}
 if(state.lesson<state.lessons.length-1){setTimeout(()=>{state.lesson++;renderCourse();window.scrollTo({top:0,behavior:"smooth"});},350);}
}
function nextLesson(){if(!state.completed.includes(state.lesson))return completeLesson();if(state.lesson<state.lessons.length-1){state.lesson++;renderCourse();}}
function goExam(){if(state.completed.length<state.lessons.length)return alert("Complete every lesson first.");location.href="/edsa-app.html?course="+encodeURIComponent(state.courseId)+"&exam=1";}
document.addEventListener("DOMContentLoaded",boot);
</script>
