<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EDSA Academy</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="app" src="/edsa-app.html" title="EDSA Academy"></iframe>
<script src="/question-banks.js"></script>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  w.generatePDF=()=>{};
  const verifyBase='https://edsa-academy.vercel.app/verify';
  function dSafe(s){return String(s||'Certificate').replace(/\s+/g,'_')}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function prepareCourse(course){
    if(!course)return;
    const bank=window.EDSA_QUESTION_BANKS?.[course.id];
    let questions=bank?bank:course.questions;
    course.questions=shuffle(questions.map(q=>{const options=[...q.options];const correctText=options[q.correct];shuffle(options);return {...q,options,correct:options.indexOf(correctText)}}));
  }
  const originalSelectCourse=w.selectCourse;
  w.selectCourse=function(courseId){originalSelectCourse.call(w,courseId);prepareCourse(w.state.selectedCourse)};
  function cert(){const id=w.state.certificateId||`EDSA-${new Date().getFullYear()}-${String(Date.now()).slice(-6)}`;if(!w.state.certificateId){w.state.certificateId=id;w.state.issueDate=new Date().toISOString();}return {id,name:w.state.studentName,course:w.state.selectedCourse?.title||'',issueDate:w.state.issueDate||new Date().toISOString()};}
  w.drawCertificateCanvas=function(cb){
    const c=w.document.getElementById('certCanvas');c.width=1536;c.height=1080;const x=c.getContext('2d'),d=cert();
    x.fillStyle='#F7F4EC';x.fillRect(0,0,1536,1080);x.strokeStyle='#D5A62A';x.lineWidth=5;x.strokeRect(18,18,1500,1044);
    x.fillStyle='#07111D';x.beginPath();x.moveTo(20,20);x.lineTo(1516,20);x.lineTo(1516,190);x.bezierCurveTo(1180,310,350,300,20,160);x.closePath();x.fill();x.strokeStyle='#D9A72E';x.lineWidth=12;x.beginPath();x.moveTo(20,160);x.bezierCurveTo(360,302,1180,310,1516,190);x.stroke();x.fillStyle='#07111D';x.fillRect(20,960,1496,100);
    x.textAlign='center';x.fillStyle='#F4C542';x.font='bold 110px Arial';x.fillText('EDSA',800,120);x.fillStyle='#fff';x.font='bold 25px Arial';x.fillText('ETHIOPIAN DIGITAL SKILLS ACADEMY',800,155);x.fillStyle='#E0A82D';x.font='bold 22px Arial';x.fillText('MASTER THE DIGITAL FRONTIER',800,184);
    x.fillStyle='#0B1320';x.font='bold 70px Georgia';x.fillText('CERTIFICATE',700,390);x.fillStyle='#B47C12';x.font='bold 30px Arial';x.fillText('OF ACHIEVEMENT',700,435);x.fillStyle='#111827';x.font='bold 26px Arial';x.fillText('THIS IS TO CERTIFY THAT',700,490);
    x.fillStyle='#101B31';x.font='italic 62px cursive';x.fillText(d.name,700,570);x.strokeStyle='#C99A28';x.lineWidth=2;x.beginPath();x.moveTo(350,590);x.lineTo(1090,590);x.stroke();x.fillStyle='#111827';x.font='22px Arial';x.fillText('has successfully completed and passed the examination for the course',700,635);x.fillStyle='#15233E';x.font='bold 38px Arial';x.fillText(d.course,700,680);x.font='21px Arial';x.fillStyle='#111827';x.fillText('offered by Ethiopian Digital Skills Academy (EDSA)',700,720);x.fillText('and is hereby awarded this certificate for outstanding performance.',700,752);
    x.fillStyle='#111827';x.font='bold 18px Arial';x.fillText('VERIFY CERTIFICATE',1300,455);x.strokeStyle='#D5A62A';x.lineWidth=5;x.strokeRect(1210,475,180,180);
    const q=w.document.getElementById('qrcode');q.innerHTML='';new w.QRCode(q,{text:`${verifyBase}?id=${encodeURIComponent(d.id)}&name=${encodeURIComponent(d.name||'')}&course=${encodeURIComponent(d.course||'')}&date=${encodeURIComponent(d.issueDate||'')}`,width:164,height:164});
    setTimeout(()=>{const qc=q.querySelector('canvas');if(qc)x.drawImage(qc,1218,483,164,164);x.font='17px Arial';x.fillStyle='#111827';x.fillText('Scan to verify authenticity',1300,690);x.fillText('or visit:',1300,718);x.font='bold 16px Arial';x.fillText('edsa-academy.vercel.app/verify',1300,744);x.fillStyle='#B47C12';x.fillText(`ID: ${d.id}`,1300,774);x.textAlign='left';x.fillStyle='#111827';x.font='bold 18px Arial';x.fillText('Issue Date',190,845);x.font='20px Arial';x.fillText(new Date(d.issueDate).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),190,875);x.font='bold 18px Arial';x.fillText('Certificate ID',190,920);x.fillStyle='#B47C12';x.fillText(d.id,190,947);x.textAlign='center';x.fillStyle='#101B31';x.font='italic 42px cursive';x.fillText('Director',1130,850);x.strokeStyle='#C99A28';x.beginPath();x.moveTo(1000,875);x.lineTo(1260,875);x.stroke();x.fillStyle='#B47C12';x.font='bold 18px Arial';x.fillText('Director',1130,905);x.fillStyle='#111827';x.font='18px Arial';x.fillText('Ethiopian Digital Skills Academy',1130,935);x.fillStyle='#fff';x.fillText('edsa-academy.vercel.app',450,1018);x.fillText('info@edsa-academy.com',830,1018);x.fillText('Ethiopia',1190,1018);if(cb)cb(d.id)},200);
  };
  w.downloadCertificate=function(){w.drawCertificateCanvas(()=>{const doc=new w.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});doc.addImage(w.document.getElementById('certCanvas').toDataURL('image/png'),'PNG',0,0,297,210);doc.save(`${dSafe(w.state.studentName)}_${w.state.certificateId}_Certificate.pdf`);});};
  w.saveCertificateImage=function(){w.drawCertificateCanvas(()=>{const a=w.document.createElement('a');a.download=`${dSafe(w.state.studentName)}_${w.state.certificateId}_Certificate.png`;a.href=w.document.getElementById('certCanvas').toDataURL('image/png');a.click();});};
  w.printCertificate=function(){w.drawCertificateCanvas(()=>{const p=w.open('','_blank');p.document.write(`<img style="width:100%" src="${w.document.getElementById('certCanvas').toDataURL('image/png')}" onload="print()">`);p.document.close();});};
});
</script>
</body></html>
