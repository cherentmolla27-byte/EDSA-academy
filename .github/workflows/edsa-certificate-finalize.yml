name: Finalize EDSA certificate redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Redesign EDSA certificates and remove temporary test trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original app and apply certificate patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          base="dd90db8242e03c78147be96eb1a2b43cffe4f00d"
          subprocess.run(["git","show",base+":index.html.html"],check=True,stdout=open("/tmp/original-index.html","wb"))
          p=Path("/tmp/original-index.html")
          s=p.read_text()
          insert_marker='    function saveStoredKeys(keys) {\n      localStorage.setItem("EDSA_KEYS", JSON.stringify(keys));\n    }\n\n    let state = {'
          insert_text='    function saveStoredKeys(keys) {\n      localStorage.setItem("EDSA_KEYS", JSON.stringify(keys));\n    }\n\n    const CERTIFICATE_STORAGE_KEY = "EDSA_CERTIFICATES";\n    const CERTIFICATE_COUNTER_KEY = "EDSA_CERTIFICATE_COUNTER";\n\n    function getStoredCertificates() {\n      try {\n        return JSON.parse(localStorage.getItem(CERTIFICATE_STORAGE_KEY) || "{}");\n      } catch (error) {\n        return {};\n      }\n    }\n\n    function saveStoredCertificates(certificates) {\n      localStorage.setItem(CERTIFICATE_STORAGE_KEY, JSON.stringify(certificates));\n    }\n\n    function createCertificateRecord() {\n      const certificates = getStoredCertificates();\n      const year = new Date().getFullYear();\n      let counter = parseInt(localStorage.getItem(CERTIFICATE_COUNTER_KEY) || "183", 10);\n      let certificateId = "";\n      do {\n        counter += 1;\n        certificateId = `EDSA-${year}-${String(counter).padStart(6, "0")}`;\n      } while (certificates[certificateId]);\n      localStorage.setItem(CERTIFICATE_COUNTER_KEY, String(counter));\n      const issueDate = new Date().toISOString();\n      certificates[certificateId] = { id: certificateId, name: state.studentName, course: state.selectedCourse?.title || "", issueDate, status: "Valid", issuedBy: "Ethiopian Digital Skills Academy", score: state.score };\n      saveStoredCertificates(certificates);\n      state.certificateId = certificateId;\n      state.issueDate = issueDate;\n      return certificates[certificateId];\n    }\n\n    function getOrCreateCertificateRecord() {\n      if (state.certificateId) {\n        const certificates = getStoredCertificates();\n        if (certificates[state.certificateId]) return certificates[state.certificateId];\n      }\n      return createCertificateRecord();\n    }\n\n    let state = {'
          assert insert_marker in s
          s=s.replace(insert_marker,insert_text,1)
          state_old='      timerInterval: null,\n      secondsLeft: 3600,\n      adminAuthenticated: false,'
          state_new='      timerInterval: null,\n      secondsLeft: 3600,\n      certificateId: "",\n      issueDate: "",\n      adminAuthenticated: false,'
          assert state_old in s
          s=s.replace(state_old,state_new,1)
          old_pass='      if (passed) {\n        icon.innerHTML = \'<i class="fa-solid fa-trophy text-sky-400"></i>\';'
          new_pass='      if (passed) {\n        getOrCreateCertificateRecord();\n        icon.innerHTML = \'<i class="fa-solid fa-trophy text-sky-400"></i>\';'
          assert old_pass in s
          s=s.replace(old_pass,new_pass,1)
          start=s.index("    // DRAW CANVAS CERTIFICATE FOR IMAGE SAVE & PRINT")
          end=s.index("    // ADMIN PANEL & LOCKOUT SECURITY FUNCTIONS",start)
          replacement='''    // EDSA CERTIFICATE GENERATION
    // One certificate record is created when the student passes and the same ID is reused
    // for PNG, PDF, print and QR verification.
    const CERTIFICATE_VERIFY_BASE = "https://edsa-academy.vercel.app/verify";
    const CERTIFICATE_W = 1536;
    const CERTIFICATE_H = 1080;

    function getCertificateData() {
      return getOrCreateCertificateRecord();
    }

    function roundedRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawSeal(ctx, cx, cy, radius) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = "#D69E16";
      ctx.strokeStyle = "#8B5E00";
      ctx.lineWidth = 5;
      ctx.beginPath();
      for (let i = 0; i < 48; i++) {
        const a = (i * Math.PI * 2) / 48;
        const r = i % 2 === 0 ? radius : radius * 0.91;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#F7D36B";
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.74, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#8B5E00";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "#0B1320";
      ctx.font = "bold 28px Georgia, serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("EDSA", 0, 3);
      ctx.font = "bold 13px Arial, sans-serif";
      ctx.fillText("ETHIOPIAN DIGITAL", 0, -radius * 0.52);
      ctx.fillText("SKILLS ACADEMY", 0, radius * 0.52);
      ctx.restore();
    }

    function drawAcademyLogo(ctx, cx, cy, scale = 1) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillStyle = "#F4C542";
      ctx.strokeStyle = "#A56A00";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-68, -20); ctx.lineTo(0, -48); ctx.lineTo(68, -20); ctx.lineTo(0, 8); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#D99A17";
      ctx.beginPath(); ctx.moveTo(-42, -4); ctx.lineTo(42, -4); ctx.lineTo(42, 18); ctx.quadraticCurveTo(0, 42, -42, 18); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#0B1320";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(0, -48); ctx.lineTo(0, 55); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 58, 7, 0, Math.PI * 2); ctx.fillStyle = "#F4C542"; ctx.fill();
      ctx.fillStyle = "#F4C542";
      ctx.beginPath();
      ctx.moveTo(0, 30); ctx.quadraticCurveTo(-48, 14, -72, 5); ctx.quadraticCurveTo(-45, 45, 0, 70); ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 30); ctx.quadraticCurveTo(48, 14, 72, 5); ctx.quadraticCurveTo(45, 45, 0, 70); ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawCertificateBackground(ctx) {
      ctx.clearRect(0, 0, CERTIFICATE_W, CERTIFICATE_H);
      ctx.fillStyle = "#F7F4EC";
      ctx.fillRect(0, 0, CERTIFICATE_W, CERTIFICATE_H);
      ctx.save();
      ctx.globalAlpha = 0.10;
      ctx.strokeStyle = "#B38A28";
      ctx.lineWidth = 1.5;
      for (let y = 300; y < 960; y += 18) {
        ctx.beginPath();
        for (let x = 0; x <= CERTIFICATE_W; x += 18) {
          const yy = y + Math.sin((x / 130) + (y / 75)) * 5;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = "#D5A62A";
      ctx.lineWidth = 4;
      ctx.strokeRect(18, 18, CERTIFICATE_W - 36, CERTIFICATE_H - 36);
      ctx.strokeStyle = "#8A620C";
      ctx.lineWidth = 1;
      ctx.strokeRect(27, 27, CERTIFICATE_W - 54, CERTIFICATE_H - 54);
      ctx.fillStyle = "#07111D";
      ctx.beginPath();
      ctx.moveTo(20, 20); ctx.lineTo(CERTIFICATE_W - 20, 20); ctx.lineTo(CERTIFICATE_W - 20, 190);
      ctx.bezierCurveTo(1180, 310, 350, 300, 20, 160); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#D9A72E";
      ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(20, 160); ctx.bezierCurveTo(360, 302, 1180, 310, CERTIFICATE_W - 20, 190); ctx.stroke();
      ctx.fillStyle = "#07111D";
      ctx.beginPath(); ctx.moveTo(20, 960); ctx.lineTo(CERTIFICATE_W - 20, 960); ctx.lineTo(CERTIFICATE_W - 20, CERTIFICATE_H - 20); ctx.lineTo(20, CERTIFICATE_H - 20); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#D9A72E";
      ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(20, 960); ctx.bezierCurveTo(360, 1085, 1180, 1085, CERTIFICATE_W - 20, 960); ctx.stroke();
    }

    function fitText(ctx, text, maxWidth, startSize, family = "Arial, sans-serif", weight = "normal") {
      let size = startSize;
      do { ctx.font = `${weight} ${size}px ${family}`; size -= 1; }
      while (ctx.measureText(text).width > maxWidth && size > 16);
      return size + 1;
    }

    function drawCertificateCanvas(callback) {
      const canvas = document.getElementById("certCanvas");
      canvas.width = CERTIFICATE_W;
      canvas.height = CERTIFICATE_H;
      const ctx = canvas.getContext("2d");
      const certificate = getCertificateData();
      const issueDate = new Date(certificate.issueDate).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
      const name = certificate.name || state.studentName;
      const course = certificate.course || state.selectedCourse.title;
      drawCertificateBackground(ctx);
      drawAcademyLogo(ctx, 480, 105, 0.85);
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#F4C542"; ctx.font = "bold 106px Arial, sans-serif"; ctx.fillText("EDSA", 800, 115);
      ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 25px Arial, sans-serif"; ctx.fillText("ETHIOPIAN DIGITAL SKILLS ACADEMY", 800, 151);
      ctx.fillStyle = "#E0A82D"; ctx.font = "bold 22px Arial, sans-serif"; ctx.fillText("MASTER THE DIGITAL FRONTIER", 800, 180);
      drawSeal(ctx, 1320, 105, 82);
      ctx.fillStyle = "#0B1320"; ctx.font = "bold 72px Georgia, serif"; ctx.fillText("CERTIFICATE", 690, 385);
      ctx.fillStyle = "#B47C12"; ctx.font = "bold 30px Arial, sans-serif"; ctx.fillText("OF ACHIEVEMENT", 690, 430);
      ctx.strokeStyle = "#C99A28"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(470, 420); ctx.lineTo(580, 420); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(800, 420); ctx.lineTo(910, 420); ctx.stroke();
      ctx.fillStyle = "#111827"; ctx.font = "bold 26px Arial, sans-serif"; ctx.fillText("THIS IS TO CERTIFY THAT", 690, 485);
      ctx.fillStyle = "#101B31";
      const nameSize = fitText(ctx, name, 820, 66, "cursive", "normal");
      ctx.font = `normal ${nameSize}px cursive`; ctx.fillText(name, 690, 565);
      ctx.strokeStyle = "#C99A28"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(350, 585); ctx.lineTo(1090, 585); ctx.stroke();
      ctx.fillStyle = "#111827"; ctx.font = "22px Arial, sans-serif"; ctx.fillText("has successfully completed and passed the examination for the course", 690, 630);
      ctx.fillStyle = "#15233E";
      const courseSize = fitText(ctx, course, 760, 38, "Arial, sans-serif", "bold");
      ctx.font = `bold ${courseSize}px Arial, sans-serif`; ctx.fillText(course, 690, 675);
      ctx.fillStyle = "#111827"; ctx.font = "21px Arial, sans-serif";
      ctx.fillText("offered by Ethiopian Digital Skills Academy (EDSA)", 690, 715);
      ctx.fillText("and is hereby awarded this certificate for outstanding performance.", 690, 748);
      ctx.textAlign = "center"; ctx.fillStyle = "#111827"; ctx.font = "bold 18px Arial, sans-serif"; ctx.fillText("VERIFY CERTIFICATE", 1290, 455);
      ctx.strokeStyle = "#D5A62A"; ctx.lineWidth = 5; ctx.strokeRect(1200, 475, 180, 180);
      const qrDiv = document.getElementById("qrcode"); qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: `${CERTIFICATE_VERIFY_BASE}?id=${encodeURIComponent(certificate.id)}`, width: 164, height: 164, correctLevel: QRCode.CorrectLevel.H });
      setTimeout(() => {
        const qrCanvas = qrDiv.querySelector("canvas"); if (qrCanvas) ctx.drawImage(qrCanvas, 1208, 483, 164, 164);
        ctx.fillStyle = "#111827"; ctx.font = "17px Arial, sans-serif"; ctx.fillText("Scan to verify authenticity", 1290, 690); ctx.fillText("or visit:", 1290, 718);
        ctx.font = "bold 16px Arial, sans-serif"; ctx.fillText("edsa-academy.vercel.app/verify", 1290, 744);
        ctx.fillStyle = "#B47C12"; ctx.fillText(`ID: ${certificate.id}`, 1290, 774);
        ctx.textAlign = "left"; ctx.fillStyle = "#111827"; ctx.font = "bold 18px Arial, sans-serif"; ctx.fillText("Issue Date", 190, 845);
        ctx.font = "20px Arial, sans-serif"; ctx.fillText(issueDate, 190, 875); ctx.strokeStyle = "#C99A28"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(190, 890); ctx.lineTo(410, 890); ctx.stroke();
        ctx.font = "bold 18px Arial, sans-serif"; ctx.fillText("Certificate ID", 190, 920); ctx.fillStyle = "#B47C12"; ctx.font = "bold 18px Arial, sans-serif"; ctx.fillText(certificate.id, 190, 947);
        drawSeal(ctx, 690, 885, 78);
        ctx.textAlign = "center"; ctx.fillStyle = "#101B31"; ctx.font = "italic 42px cursive"; ctx.fillText("Director", 1125, 850); ctx.strokeStyle = "#C99A28"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1000, 875); ctx.lineTo(1250, 875); ctx.stroke();
        ctx.fillStyle = "#B47C12"; ctx.font = "bold 18px Arial, sans-serif"; ctx.fillText("Director", 1125, 905); ctx.fillStyle = "#111827"; ctx.font = "18px Arial, sans-serif"; ctx.fillText("Ethiopian Digital Skills Academy", 1125, 935);
        ctx.fillStyle = "#FFFFFF"; ctx.font = "18px Arial, sans-serif"; ctx.fillText("◉  edsa-academy.vercel.app", 430, 1018); ctx.fillText("✉  info@edsa-academy.com", 820, 1018); ctx.fillText("⌖  Ethiopia", 1180, 1018);
        if (callback) callback(certificate.id);
      }, 250);
    }

    function saveCertificateImage() {
      drawCertificateCanvas(() => { const canvas = document.getElementById("certCanvas"); const imageURI = canvas.toDataURL("image/png"); const link = document.createElement("a"); link.download = `${state.studentName.replace(/\s+/g, "_")}_${state.certificateId}_Certificate.png`; link.href = imageURI; document.body.appendChild(link); link.click(); document.body.removeChild(link); });
    }

    function printCertificate() {
      drawCertificateCanvas(() => { const canvas = document.getElementById("certCanvas"); const dataUrl = canvas.toDataURL("image/png"); const printWindow = window.open("", "_blank"); printWindow.document.write(`<html><head><title>EDSA Certificate - ${state.studentName}</title><style>@page{size:landscape;margin:0}body{margin:0;background:#fff}img{width:100%;height:auto;display:block}</style></head><body><img src="${dataUrl}" onload="window.print();window.close();"></body></html>`); printWindow.document.close(); });
    }

    function downloadCertificate() {
      drawCertificateCanvas(() => { const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" }); const canvas = document.getElementById("certCanvas"); doc.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, 297, 210); doc.save(`${state.studentName.replace(/\s+/g, "_")}_${state.certificateId}_Certificate.pdf`); });
    }

'''
          s=s[:start]+replacement+s[end:]
          old_temp='    // --- TEMPORARY TEST TRIGGER ---\n    state.studentName = "Cherenet Molla Alem";\n    state.selectedCourse = { title: "Social Media Management" };\n    setTimeout(() => { generatePDF(); }, 1000);\n\n'
          assert old_temp in s
          s=s.replace(old_temp,"",1)
          Path("index.html.html").write_text(s)
      - name: Validate patched app
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html.html').read_text()
          assert 'TEMPORARY TEST TRIGGER' not in s
          assert 'function generatePDF' not in s
          assert 'CERTIFICATE_VERIFY_BASE' in s
          assert 'getOrCreateCertificateRecord' in s
          print('EDSA certificate changes validated')
          PY
      - name: Commit final app
        run: |
          git config user.name "EDSA Certificate Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html.html
          git commit -m "Finalize EDSA certificate redesign"
          git push
          git rm -f .github/workflows/edsa-certificate-finalize.yml || true
          git commit -m "Remove certificate migration workflow" || true
          git push || true
