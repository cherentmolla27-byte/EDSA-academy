name: Final EDSA hero image fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-hero:
    if: github.event.head_commit.message != 'Apply final high-quality EDSA hero image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace low-resolution hero source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/edsa-real-hero.jpg?v=5'
          new = '/edsa-reference-hero.svg?v=final'
          if old not in s:
              raise SystemExit('Expected hero source was not found; stopping safely.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final hero change and remove temporary workflow
        run: |
          rm -f .github/workflows/final-hero-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/final-hero-fix.yml
          git commit -m "Apply final high-quality EDSA hero image"
          git push