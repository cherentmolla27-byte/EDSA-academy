<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EDSA Admin Learning Preview</title>
<style>
body{margin:0;background:#061a3b;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
main{text-align:center;padding:30px}p{color:#bfdbfe;font-size:14px}
</style>
</head>
<body>
<main><strong>Opening EDSA Administrator Preview…</strong><p>Verifying administrator access.</p></main>
<script>
(async function(){
  try{
    const r=await fetch('/api/admin-me',{credentials:'include',cache:'no-store'});
    const x=await r.json().catch(()=>({}));
    const role=x&&x.user&&x.user.role ? x.user.role : (x&&x.role ? x.role : '');
    if(!r.ok || !x.ok || role!=='admin'){
      location.href='/';
      return;
    }
    const p=new URLSearchParams(location.search);
    p.set('adminPreview','1');
    location.replace('/learning.html?'+p.toString());
  }catch(e){
    document.body.innerHTML='<main><strong>Administrator Preview could not be opened.</strong><p>'+String(e.message||e)+'</p></main>';
  }
})();
</script>
</body>
</html>
